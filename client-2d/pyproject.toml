# ABOUTME: Package configuration for the 2D graphical client using Arcade library.
# ABOUTME: Provides sprite-based rendering, fog of war, and D&D-compliant lighting.

[project]
name = "dnd-2d-client"
version = "0.1.0"
description = "2D graphical client for the D&D 5E game engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Joe Cotellese" }
]

dependencies = [
    # Phase 1: Standalone systems (fog, lighting, input, assets) - no engine dependency
    "numpy>=1.24.0",
]

[project.optional-dependencies]
graphics = [
    # Required for actual rendering (not needed for unit tests)
    "arcade>=2.6.0",
]
engine = [
    # Required for Phase 2+ integration with dnd-engine
    # "dnd-engine",  # Uncomment when ready for integration
]
mcp = [
    # Required for MCP server (Claude-driven playtesting)
    "mcp[cli]>=1.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
]

[project.scripts]
dnd-2d = "client_2d.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/client_2d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
